<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Code instead love</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="draw-pct.css" />
  </head>
  <body>
    <main>
      <br />
      <div class="flex-container">
        <div class="width-picker">
          <button class="btn-width-increase">+</button>

          <button class="color" data-color="#f97316"></button>
          <button class="color" data-color="#eab308"></button>
          <button class="color" data-color="#22c55e"></button>
          <button class="color" data-color="#06b6d4"></button>
          <button class="color" data-color="#3b82f6"></button>
          <button class="color" data-color="#8b5cf6"></button>
          <button class="color" data-color="#111827"></button>
        </div>
        <button class="return-btn">⟵</button>
        <canvas id="canvas" width="650" height="600"> </canvas>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
